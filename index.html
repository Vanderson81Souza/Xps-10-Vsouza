 <style>
 /* ==========================================================================
 1. VARIÁVEIS DE AMBIENTE E RESET (TEMA CLARO EXCLUSIVO - ALUMÍNIO)
 ========================================================================== */
 :root {
 --bg-color: #e1e4e6;
 --card-bg: #f5f7f8;
 --primary: #007aff;
 --accent: #34c759;
 --eq-color: #ff9500;
 --danger: #ff3b30;
 --text: #1c1c1e;
 --text-muted: #8e8e93;
 --border: #c7c7cc;
 --fader-track: #d1d1d6;
 --input-bg: #ffffff;
 --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
 --shadow-md: 0 4px 20px rgba(0,0,0,0.15);
 --transition-fast: 0.2s ease;
 }
 html, body {
 overflow: hidden;
 touch-action: none;
 height: 100vh;
 margin: 0;
 padding: 0;
 }
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
 background-color: var(--bg-color);
 color: var(--text);
 padding: 8px;
 display: flex;
 flex-direction: column;
 box-sizing: border-box;
 user-select: none;
 }
 /* ==========================================================================
 2. COMPONENTES DE LAYOUT E CABEÇALHO
 ========================================================================== */
 header {
 margin-bottom: 6px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 flex-wrap: wrap;
 gap: 8px;
 background: linear-gradient(180deg, #ffffff, #e5e5e5);
 padding: 6px 12px;
 border-radius: 6px;
 border: 1px solid var(--border);
 box-shadow: var(--shadow-sm);
 }
 .header-left {
 display: flex;
 align-items: center;
 gap: 12px;
 }
 h1 { 
 margin: 0; 
 font-size: 1.1rem; 
 font-weight: 700; 
 letter-spacing: -0.3px; 
 color: #222; 
 }
 .midi-status-container {
 display: flex;
 align-items: center;
 gap: 6px;
 }
 #status-bar {
 padding: 3px 10px;
 border-radius: 4px;
 font-size: 0.75rem;
 font-weight: bold;
 background-color: #eedddd;
 color: var(--danger);
 border: 1px solid #cc9999;
 }
 #status-bar.connected {
 background-color: #ddeedd;
 color: var(--accent);
 border: 1px solid #99cc99;
 }
 .midi-led {
 width: 10px;
 height: 10px;
 border-radius: 50%;

<body>
 <header>
 <div class="header-left">
 <h1>XPS-10 Mixer Pro & Performance Manager</h1>
 <div class="midi-status-container">
 <div id="status-bar">Aguardando MIDI...</div>
 <div class="midi-led" id="midi-activity-led"></div>
 </div>
 </div>
 <div class="crud-container">
 <button class="crud-btn btn-load" style="background: linear-gradient(180deg, #ff9500, #cc7a00); border-color: #aa6600;" onclick="solicitarPerformanceHardware()">REQUISITAR PERFORMANCE</button>
 <select id="scene-select">
 <option value="">-- Mixagens Salvas --</option>
 </select>
 <button class="crud-btn btn-load" onclick="carregarCena()">ABRIR</button>
 <button class="crud-btn btn-save" onclick="abrirModalSalvar()">SALVAR</button>
 <button class="crud-btn btn-delete" onclick="deletarCena()">EXCLUIR</button>
 </div>
 </header>
 <div class="console-layout">
 <div class="master-section">
 <div class="master-title">MASTER</div>
 <div class="fader-wrapper">
 <input type="range" class="fader-input" id="master-fader" min="0" max="127" value="127">
 </div>
 <div class="master-display" id="master-val">127</div>
 <div class="mute-groups">
 <button class="mg-btn" id="mg1" onclick="toggleMuteGroup(1)">MUTE 1-8</button>
 <button class="mg-btn" id="mg2" onclick="toggleMuteGroup(2)">MUTE 9-16</button>
 </div>
 </div>
 <main class="mixer-container" id="mixer"></main>
 </div>
 <div class="modal-overlay" id="fx-modal">
 <div class="modal-content">
 <div class="modal-header">
 <div class="modal-title" id="modal-ch-title">Editar Canal</div>
 <button class="close-btn" onclick="fecharPopup()">FECHAR</button>
 </div>
 
 <div class="modal-tabs">
 <button class="tab-btn active" id="tab-fx-btn" onclick="switchTab('fx')">EFEITOS & EQ</button>
 <button class="tab-btn" id="tab-patch-btn" onclick="switchTab('patch')">SELEÇÃO DE TIMBRE</button>
 </div>
 <div class="tab-content active" id="tab-fx-content">
 <div class="color-picker-container" id="ch-color-picker"></div>
 <div class="modal-fx-grid" id="modal-sliders-container"></div>
 </div>

 <select id="patch-bank" onchange="atualizarSelectTimbres()"></select>
 </div>
 </div>

 <select id="patch-program" onchange="enviarMudancaTimbre()"></select>
 </div>

 </div>
 </div>
 </div>
 <div class="modal-overlay" id="save-modal">

 <button class="close-btn" onclick="fecharModalSalvar()">CANCELAR</button>
 </div>

 <input type="text" id="save-custom-name" placeholder="Digite o nome..." maxlength="20">
 </div>
 <button class="crud-btn btn-save" style="width:100%; margin-top:8px; height:34px;" onclick="executarSalvamento()">GRAVAR ALTERAÇÕES</button>
 </div>

 <script>
 // ==========================================================================
 // 11. CONSTANTES GLOBAIS E ESTADO DO APLICATIVO
 // ==========================================================================
 
 // Estado centralizado dos 16 canais (Injetando parâmetros de banco e programa)
 let canaisEstado = Array.from({ length: 16 }, () => ({
 volume: 100,
 reverb: 40,
 cutoff: 64,
 resonance: 64,
 attack: 64,
 release: 64,
 eqLow: 64,
 eqMid: 64,
 eqHigh: 64,
 pan: 64,
 isMuted: false, // Controlado via SysEx Part Sw
 isSoloed: false,
 isLinked: false,
 label: "",
 color: "",
 bankIndex: 0, // Índice do banco selecionado no array de bancos
 patchPC: 1 // Número do programa (Program Change de 1 a 128)
 }));
 let isDirty = false;
 let midiOutput = null;
 let midiInput = null;
 let canalAtivoNoPopup = 0;
 let crossfadeIntervals = [];
 let RO_BANCOS_XPS10 = [];
 const timbresDataEl = document.getElementById("app-timbres-data");
 if (timbresDataEl) {
   try {
     const embeddedData = JSON.parse(timbresDataEl.textContent);
     RO_BANCOS_XPS10 = embeddedData.bancos_xps10 || [];
   } catch (error) {
     console.warn("Não foi possível carregar os timbres embutidos.", error);
   }
 }

 // Paleta de gradientes para personalização visual das tiras de canais
 const stripColors = [
 { name: "Padrão", value: "" },
 { name: "Azul", value: "linear-gradient(180deg, #3498db, #2980b9)" },
 { name: "Vermelho", value: "linear-gradient(180deg, #e74c3c, #c0392b)" },
 { name: "Verde", value: "linear-gradient(180deg, #2ecc71, #27ae60)" },
 { name: "Amarelo", value: "linear-gradient(180deg, #f1c40f, #f39c12)" },
 { name: "Roxo", value: "linear-gradient(180deg, #9b59b6, #8e44ad)" }
 ];

 // Mapeamento dos controles de efeito (Midi CC e offsets SysEx)
 const fxConfig = [
 { label: "REVERB", cc: 91, chave: "reverb", isEQ: false },
 { label: "CUTOFF", cc: 74, chave: "cutoff", isEQ: false },
 { label: "RESONANCE", cc: 71, chave: "resonance", isEQ: false },
 { label: "ATTACK", cc: 73, KEY: "attack", chave: "attack", isEQ: false },
 { label: "RELEASE", cc: 72, chave: "release", isEQ: false },
 { label: "GRAVES (LOW)", offset: 0x24, chave: "eqLow", isEQ: true },
 { label: "MÉDIOS (MID)", offset: 0x28, chave: "eqMid", isEQ: true },
 { label: "AGUDOS (HIGH)", offset: 0x2C, chave: "eqHigh", isEQ: true }
 ];

 // Cache dos seletores principais da DOM
 const statusBar = document.getElementById("status-bar");
 const modal = document.getElementById("fx-modal");
 const saveModal = document.getElementById("save-modal");
 const activityLed = document.getElementById("midi-activity-led");
 // ==========================================================================
 // 13. CONEXÃO MIDI, ENTRADA/SAÍDA E REQUISIÇÃO SYSEX (SINCRO BIDIRECIONAL)
 // ==========================================================================
 if (navigator.requestMIDIAccess) {
 navigator.requestMIDIAccess({ sysex: true }).then(access => {
 tentarConectarMIDI(access);
 
 access.onstatechange = (event) => {
 const porta = event.port;
 if (porta.name.toLowerCase().includes("xps-10") || 
 porta.name.toLowerCase().includes("roland")) {
 if (porta.state === "connected") {
 tentarConectarMIDI(access);
 } else if (porta.state === "disconnected") {
 definirComoDesconectado();
 }
 }
 };
 }, () => {
 statusBar.innerText = "Erro MIDI (Sem SysEx)";
 statusBar.style.backgroundColor = "#eedddd";
 });
 }

 function tentarConectarMIDI(access) {
 let outAchado = false;
 let inAchado = false;
 for (let output of access.outputs.values()) {
 if (output.name.toLowerCase().includes("xps-10") || 
 output.name.toLowerCase().includes("roland")) {
 midiOutput = output;
 outAchado = true;
 break;
 }
 }
 for (let input of access.inputs.values()) {
 if (input.name.toLowerCase().includes("xps-10") || 
 input.name.toLowerCase().includes("roland")) {
 midiInput = input;
 midiInput.onmidimessage = tratarMensagemMidiRecebida;
 inAchado = true;
 break;
 }
 }
 if (outAchado && inAchado) {
 statusBar.innerText = "Conectado Bidirecional: " + midiOutput.name;
 statusBar.className = "connected";
 sincronizarMutesHardware();
 } else if (outAchado || inAchado) {
 statusBar.innerText = "Conexão MIDI Parcial";
 statusBar.className = "";
 } else {
 definirComoDesconectado();
 }
 }

 function definirComoDesconectado() {
 midiOutput = null;
 midiInput = null;
 statusBar.innerText = "Aguardando MIDI...";
 statusBar.className = "";
 }

 function blinkLed() {
 activityLed.classList.add("blink");
 setTimeout(() => activityLed.classList.remove("blink"), 45);
 }

 function enviarCC(canal, cc, valor) {
 if (midiOutput) { 
 midiOutput.send([0xB0 + canal, cc, valor]); 
 blinkLed(); 
 }
 }

 function enviarSysExRoland(addrH, addrM1, addrM2, addrL, valor) {
 if (!midiOutput) return;
 let somaBytes = addrH + addrM1 + addrM2 + addrL + valor;
 let checksum = 128 - (somaBytes % 128);
 if (checksum === 128) checksum = 0;
 midiOutput.send([
 0xF0, 0x41, 0x10, 0x00, 0x00, 0x6A, 0x12,
 addrH, addrM1, addrM2, addrL, valor, checksum, 0xF7
 ]);
 blinkLed();
 }
 function solicitarPerformanceHardware() {
 if (!midiOutput) return alert("Conecte o XPS-10 para receber a Performance!");
 statusBar.innerText = "Lendo Performance do Hardware...";
 
 const addrH = 0x10, addrM1 = 0x00, addrM2 = 0x00, addrL = 0x00;
 const sizeH = 0x00, sizeM1 = 0x00, sizeM2 = 0x01, sizeL = 0x00;
 
 let soma = addrH + addrM1 + addrM2 + addrL + sizeH + sizeM1 + sizeM2 + sizeL;
 let checksum = 128 - (soma % 128);
 if (checksum === 128) checksum = 0;
 midiOutput.send([
 0xF0, 0x41, 0x10, 0x00, 0x00, 0x6A, 0x11,
 addrH, addrM1, addrM2, addrL,
 sizeH, sizeM1, sizeM2, sizeL,
 checksum, 0xF7
 ]);
 blinkLed();
 }

 function tratarMensagemMidiRecebida(event) {
 const dados = event.data;
 if (!dados || dados[0] !== 0xF0) return;
 
 if (dados[1] === 0x41 && dados[6] === 0x12) {
 blinkLed();
 const addrH = dados[7];
 const addrM1 = dados[8];
 const addrM2 = dados[9];
 const addrL = dados[10];
 const valorRecebido = dados[11];
 
 if (addrH === 0x10 && addrM1 === 0x00 && (addrM2 >= 0x20 && addrM2 <= 0x2F)) {
 const canalPart = addrM2 - 0x20;
 const parametroOffset = addrL;
 sincronizarDadoHardwareParaSoftware(canalPart, parametroOffset, valorRecebido);
 }
 }
 }

 function sincronizarDadoHardwareParaSoftware(canal, offset, valor) {
 if (offset === 0x02) {
 const isMuted = (valor === 0);
 canaisEstado[canal].isMuted = isMuted;
 document.getElementById(`mute-${canal}`).classList.toggle("active", isMuted);
 document.getElementById(`strip-${canal}`).classList.toggle("muted", isMuted);
 } else if (offset === 0x1A) {
 canaisEstado[canal].volume = valor;
 document.getElementById(`fad-${canal}`).value = valor;
 document.getElementById(`vdisp-${canal}`).innerText = valor;
 atualizarVUMeter(canal, valor);
 } else if (offset === 0x1C) {
 canaisEstado[canal].pan = valor;
 document.getElementById(`pan-${canal}`).value = valor;
 const disp = document.getElementById(`pdisp-${canal}`);
 if(valor === 64) disp.innerText = "C";
 else if(valor < 64) disp.innerText = "L" + Math.round(((64 - valor)/64)*100);
 else disp.innerText = "R" + Math.round(((valor - 64)/64)*100);
 }
 statusBar.innerText = `Sincronizado: CH ${canal + 1} Atualizado`;
 }

 function enviarSysExEQ(canal, parametroOffset, valor) {
 enviarSysExRoland(0x18, 0x00, 0x20 + canal, parametroOffset, valor);
 }

 function enviarSysExPartSwitch(canal, ligado) {
 const valorMidi = ligado ? 1 : 0;
 enviarSysExRoland(0x18, 0x00, 0x20 + canal, 0x02, valorMidi);
 }

 function sincronizarMutesHardware() {
 if (!midiOutput) return;
 for (let i = 0; i < 16; i++) {
 enviarSysExPartSwitch(i, !canaisEstado[i].isMuted);
 }
 }
 // ==========================================================================
 // 14. MOTOR VISUAL - GERADOR DINÂMICO DE CHASSIS DE MIXAGEM (UI RENDERER)
 // ==========================================================================
 const mixer = document.getElementById("mixer");
 
 function inicializarConsoleCanais() {
 mixer.innerHTML = ""; // Limpa para rebuild seguro
 for (let i = 0; i < 16; i++) {
 const ch = i;
 const strip = document.createElement("div");
 strip.className = "channel-strip";
 strip.id = `strip-${ch}`;
 
 // Injeção de Template Semântico no DOM
 strip.innerHTML = `
 <div class="strip-header-controls">
 <input type="text" class="channel-name-input" id="name-in-${ch}" 
placeholder="CH ${ch + 1}" maxlength="12">
 </div>
 <div class="pan-container">
 <span class="pan-label" id="pdisp-${ch}">C</span>
 <input type="range" class="pan-input" id="pan-${ch}" min="0" max="127" 
value="64">
 </div>
 ${ch < 15 ? `<button class="link-row-btn" id="lnk-${ch}" 
onclick="toggleLink(${ch})">LINK STEREO</button>` : '<div style="height:23px;"></div>'}
 <div class="fader-layout-box">
 <div class="vu-meter" id="vu-${ch}">
 ${Array.from({ length: 15 }, (_, idx) => `<div class="vu-segment ${idx < 2 ? 'red' : 
idx < 5 ? 'yellow' : 'green'}"></div>`).join("")}
 </div>
 <div class="fader-wrapper">
 <input type="range" class="fader-input" id="fad-${ch}" min="0" max="127" 
value="100">
 </div>
 </div>
 <div class="volume-display" id="vdisp-${ch}">100</div>
 <div class="btn-group">
 <button class="fx-btn" onclick="abrirPopup(${ch})">FX</button>
 <button class="solo-btn" id="solo-${ch}" onclick="toggleSolo(${ch})">S</button>
 <button class="mute-btn" id="mute-${ch}" 
onclick="toggleMute(${ch})">M</button>
 </div>
 `;
 
 mixer.appendChild(strip);
 atualizarVUMeter(ch, 100);
 // Vinculação de escutas de eventos (Listeners) nativas por canal
 document.getElementById(`fad-${ch}`).addEventListener("input", (e) => 
moverFaderManual(ch, parseInt(e.target.value)));
 document.getElementById(`pan-${ch}`).addEventListener("input", (e) => 
moverPanManual(ch, parseInt(e.target.value)));
 document.getElementById(`name-in-${ch}`).addEventListener("input", (e) => {
 canaisEstado[ch].label = e.target.value;
 isDirty = true;
 });
 }
 }

 function atualizarVUMeter(ch, volume) {
 const segments = document.querySelectorAll(`#vu-${ch} .vu-segment`);
 const activeCount = Math.ceil((volume / 127) * 15);
 segments.forEach((seg, idx) => {
 const invertedIndex = 14 - idx;
 if (invertedIndex < activeCount) { 
 seg.classList.add("active"); 
 } else { 
 seg.classList.remove("active"); 
 }
 });
 }
 // ==========================================================================
 // 15. ENGENHARIA DE CONTROLE DOS CANAIS (VOLUME, PAN, MUTE, SOLO & LINK)
 // ==========================================================================
 const masterFader = document.getElementById("master-fader");
 const masterVal = document.getElementById("master-val");
 
 masterFader.addEventListener("input", (e) => {
 const v = parseInt(e.target.value); 
 masterVal.innerText = v;
 for(let i = 0; i < 16; i++) {
 enviarCC(i, 11, v); // Atenuador Expression global
 }
 });

 function moverFaderManual(ch, vol) {
 modificarVolumeEstado(ch, vol);
 if (canaisEstado[ch].isLinked && ch < 15) {
 modificarVolumeEstado(ch + 1, vol);
 document.getElementById(`fad-${ch + 1}`).value = vol;
 } else if (ch > 0 && canaisEstado[ch - 1].isLinked) {
 modificarVolumeEstado(ch - 1, vol);
 document.getElementById(`fad-${ch - 1}`).value = vol;
 }
 }

 function modificarVolumeEstado(ch, vol) {
 document.getElementById(`vdisp-${ch}`).innerText = vol;
 canaisEstado[ch].volume = vol; 
 isDirty = true;
 atualizarVUMeter(ch, vol);
 
 if (!canaisEstado[ch].isMuted && !verificarBloqueioSolo(ch)) {
 enviarCC(ch, 7, vol);
 }
 }

 function moverPanManual(ch, pVal) {
 modificarPanEstado(ch, pVal);
 if (canaisEstado[ch].isLinked && ch < 15) {
 let pInvertido = 127 - pVal;
 modificarPanEstado(ch + 1, pInvertido);
 document.getElementById(`pan-${ch + 1}`).value = pInvertido;
 }
 }

 function modificarPanEstado(ch, pVal) {
 canaisEstado[ch].pan = pVal; 
 isDirty = true;
 const disp = document.getElementById(`pdisp-${ch}`);
 
 if(pVal === 64) {
 disp.innerText = "C";
 } else if(pVal < 64) {
 disp.innerText = "L" + Math.round(((64 - pVal) / 64) * 100);
 } else {
 disp.innerText = "R" + Math.round(((pVal - 64) / 64) * 100);
 }
 enviarCC(ch, 10, pVal);
 }

 function toggleLink(ch) {
 canaisEstado[ch].isLinked = !canaisEstado[ch].isLinked; 
 isDirty = true;
 const btn = document.getElementById(`lnk-${ch}`);
 const strip = document.getElementById(`strip-${ch}`);
 
 if(canaisEstado[ch].isLinked) {
 btn.classList.add("active"); 
 strip.classList.add("linked-next");
 moverFaderManual(ch, canaisEstado[ch].volume);
 } else {
 btn.classList.remove("active"); 
 strip.classList.remove("linked-next");
 }
 }

 function toggleMute(ch) {
 const estado = canaisEstado[ch]; 
 const btn = document.getElementById(`mute-${ch}`); 
 const strip = document.getElementById(`strip-${ch}`);
 
 estado.isMuted = !estado.isMuted; 
 isDirty = true;
 
 if (estado.isMuted) { 
 btn.classList.add("active"); 
 strip.classList.add("muted"); 
 enviarSysExPartSwitch(ch, false);
 } else { 
 btn.classList.remove("active"); 
 strip.classList.remove("muted");
 if(!verificarBloqueioSolo(ch)) {
 enviarSysExPartSwitch(ch, true);
 enviarCC(ch, 7, estado.volume);
 } 
 }
 }

 function toggleSolo(ch) {
 canaisEstado[ch].isSoloed = !canaisEstado[ch].isSoloed; 
 isDirty = true;
 document.getElementById(`solo-${ch}`).classList.toggle("active", canaisEstado[ch].isSoloed);
 atualizarFadersPorRegraSoloMute();
 }

 function verificarBloqueioSolo(ch) {
 const algumSoloAtivo = canaisEstado.some(c => c.isSoloed);
 if (algumSoloAtivo && !canaisEstado[ch].isSoloed) return true;
 return false;
 }

 function atualizarFadersPorRegraSoloMute() {
 for(let i = 0; i < 16; i++) {
 const estado = canaisEstado[i];
 if (estado.isMuted || verificarBloqueioSolo(i)) { 
 enviarSysExPartSwitch(i, false); 
 } else { 
 enviarSysExPartSwitch(i, true);
 enviarCC(i, 7, estado.volume);
 }
 }
 }

 function toggleMuteGroup(group) {
 const btn = document.getElementById(`mg${group}`); 
 const active = btn.classList.toggle("active");
 const start = group === 1 ? 0 : 8; 
 const end = group === 1 ? 8 : 16;
 
 for (let i = start; i < end; i++) { 
 if (canaisEstado[i].isMuted !== active) toggleMute(i); 
 }
 }
 // ==========================================================================
 // 16. CONTROLADOR DE INTERFACE MODAL E NAVEGAÇÃO ENTRE ABAS (TABS)
 // ==========================================================================
 function switchTab(tabName) {
 document.getElementById("tab-fx-btn").classList.remove("active");
 document.getElementById("tab-patch-btn").classList.remove("active");
 document.getElementById("tab-fx-content").classList.remove("active");
 document.getElementById("tab-patch-content").classList.remove("active");
 
 if (tabName === 'fx') {
 document.getElementById("tab-fx-btn").classList.add("active");
 document.getElementById("tab-fx-content").classList.add("active");
 } else if (tabName === 'patch') {
 document.getElementById("tab-patch-btn").classList.add("active");
 document.getElementById("tab-patch-content").classList.add("active");
 // Sincroniza os seletores de timbres apenas quando o container HTML está ativo
 sincronizarCamposTimbre();
 }
 }

 // ==========================================================================
 // 17. INJEÇÃO DINÂMICA DE FX/EQ E CONTROLES GERAIS
 // ==========================================================================
 const containerSliders = document.getElementById("modal-sliders-container");
 containerSliders.innerHTML = fxConfig.map(c => `
 <div class="fx-column">
 <span class="fx-label ${c.isEQ ? 'eq-lbl' : ''}">${c.label}</span>
 <div class="fx-slider-wrapper">
 <input type="range" class="fx-slider ${c.isEQ ? 'eq-slide' : ''}" id="mdl-${c.chave}" 
 min="0" max="127">
 </div>
 <span class="fx-value" id="vmdl-${c.chave}">64</span>
 </div>
 `).join("");

 fxConfig.forEach(c => {
 const input = document.getElementById(`mdl-${c.chave}`);
 const disp = document.getElementById(`vmdl-${c.chave}`);
 
 input.addEventListener("input", (e) => {
 const v = parseInt(e.target.value); 
 disp.innerText = v;
 canaisEstado[canalAtivoNoPopup][c.chave] = v; 
 isDirty = true;
 
 if(c.isEQ) { 
 enviarSysExEQ(canalAtivoNoPopup, c.offset, v); 
 } else {
 enviarCC(canalAtivoNoPopup, c.cc, v); 
 }
 });
 });

 const picker = document.getElementById("ch-color-picker");
 picker.innerHTML = stripColors.map(col => `
 <div class="color-dot" style="background:${col.value || '#888'}" title="${col.name}" 
 onclick="selecionarCorCanal('${col.value}')"></div>
 `).join("");

 function abrirPopup(ch) {
 canalAtivoNoPopup = ch;
 const nomeCustomizado = canaisEstado[ch].label || `Canal ${ch + 1}`;
 document.getElementById("modal-ch-title").innerText = `Editar - ${nomeCustomizado.toUpperCase()}`;
 
 fxConfig.forEach(c => {
 const v = canaisEstado[ch][c.chave]; 
 document.getElementById(`mdl-${c.chave}`).value = v;
 document.getElementById(`vmdl-${c.chave}`).innerText = v;
 });

 // Abre o modal redefinindo o foco na primeira aba de efeitos
 switchTab('fx');
 
 // Monta as categorias de bancos de forma limpa
 popularSelectBancos();
 
 modal.classList.add("active");
 }

 function fecharPopup() {
 modal.classList.remove("active");
 }
 function popularSelectBancos() {
 const selectBanco = document.getElementById("patch-bank");
 if (!selectBanco) return;
 
 // CORREÇÃO: Alterado de .nome para .categoria para ler direto do JSON do XPS10
 selectBanco.innerHTML = RO_BANCOS_XPS10.map((banco, idx) => `
 <option value="${idx}">${banco.categoria} [MSB:${banco.msb} LSB:${banco.lsb}]</option>
 `).join("");
 }

 function sincronizarCamposTimbre() {
 const estadoCanal = canaisEstado[canalAtivoNoPopup];
 const selectBanco = document.getElementById("patch-bank");
 const selectProgram = document.getElementById("patch-program");
 if (!selectBanco || !selectProgram || !estadoCanal) return;

 // 1. Define o índice do banco previamente salvo na memória do canal ativo
 selectBanco.value = estadoCanal.bankIndex;
 
 // 2. Monta a lista HTML de timbres (patches) correspondente a esse banco
 atualizarSelectTimbres();
 
 // 3. Aplica o timbre (PC) que estava guardado na memória
 selectProgram.value = estadoCanal.patchPC;
 }

 function atualizarSelectTimbres() {
 const selectBanco = document.getElementById("patch-bank");
 if (!selectBanco || RO_BANCOS_XPS10.length === 0) return;
 
 const bankIdx = parseInt(selectBanco.value) || 0;
 
 // Sincroniza a mudança de banco feita pelo usuário na tela para a memória
 if (canaisEstado[canalAtivoNoPopup]) {
 canaisEstado[canalAtivoNoPopup].bankIndex = bankIdx;
 }
 
 const selectProgram = document.getElementById("patch-program");
 const bancoSelecionado = RO_BANCOS_XPS10[bankIdx];

 if (bancoSelecionado && selectProgram) {
 selectProgram.innerHTML = bancoSelecionado.timbres.map(t => `
 <option value="${t.pc}">${t.nome}</option>
 `).join("");
 
 // Caso o usuário mude de banco, define o Program Change inicial da nova lista
 const pcVal = parseInt(selectProgram.value) || 1;
 canaisEstado[canalAtivoNoPopup].patchPC = pcVal;
 }
 }

 function enviarMudancaTimbre() {
 const bankIdx = parseInt(document.getElementById("patch-bank").value) || 0;
 const pcVal = parseInt(document.getElementById("patch-program").value) || 1;
 
 canaisEstado[canalAtivoNoPopup].bankIndex = bankIdx;
 canaisEstado[canalAtivoNoPopup].patchPC = pcVal;
 isDirty = true;

 const bancoRoland = RO_BANCOS_XPS10[bankIdx];
 if (!bancoRoland) return;

 enviarCC(canalAtivoNoPopup, 0, bancoRoland.msb);
 enviarCC(canalAtivoNoPopup, 32, bancoRoland.lsb);
 
 if (midiOutput) {
 midiOutput.send([0xC0 + canalAtivoNoPopup, pcVal - 1]);
 blinkLed();
 }
 }
